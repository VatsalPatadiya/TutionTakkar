<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      /* Unity's standard page, plus one thing: the Google sign-in sheet (hidden until the game asks). */
      #unity-logo-title-footer { display:none }
      #tt-gsheet { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(16,24,28,.6); z-index:10 }
      #tt-gsheet .card { width:min(400px, 92vw); background:#FFFDF4; border-radius:20px; padding:22px 20px; box-sizing:border-box;
                         font-family:arial, sans-serif; color:#1F2A44; text-align:center }
      #tt-gsheet h2 { font-size:22px; margin:0 0 6px }
      #tt-gsheet p { margin:0 0 16px; font-size:15px; color:#33424F }
      #tt-gbtn { display:flex; justify-content:center; min-height:44px }
      #tt-gcancel { margin-top:14px; width:100%; min-height:48px; border:2px solid #1F2A44; border-radius:12px; background:#fff;
                    font:bold 16px arial, sans-serif; color:#1F2A44; cursor:pointer }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">{{{ PRODUCT_NAME }}}</div>
      </div>
    </div>
    <div id="tt-gsheet" role="dialog" aria-modal="true" aria-labelledby="tt-gtitle">
      <div class="card">
        <h2 id="tt-gtitle">Sign in with Google</h2>
        <p>same account as the phone app</p>
        <div id="tt-gbtn"></div>
        <button id="tt-gcancel" type="button">Not now</button>
      </div>
    </div>
    <script>
      // ---------- Google sign-in (the game calls this through Plugins/WebGL/TTGoogle.jslib) ----------
      (function () {
        var gisLoading = null, gisClient = null, pending = null;
        function finish(ok, text) {
          document.getElementById("tt-gsheet").style.display = "none";
          var done = pending; pending = null;
          if (done) done(ok, text);
        }
        function nameFrom(jwt) {
          try {
            var p = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
            return JSON.parse(decodeURIComponent(escape(atob(p)))).given_name || "";
          } catch (e) { return ""; }
        }
        function loadGis() {
          if (gisLoading) return gisLoading;
          gisLoading = new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = "https://accounts.google.com/gsi/client";
            s.async = true;
            s.onload = resolve;
            s.onerror = function () { gisLoading = null; reject(); };
            document.head.appendChild(s);
          });
          return gisLoading;
        }
        window.ttGoogleSignIn = function (clientId, done) {
          if (pending) pending(false, "cancelled|replaced");
          pending = done;
          // Google blocks sign-in inside apps' built-in browsers (WhatsApp, Instagram, ...).
          if (/FBAN|FBAV|Instagram|WhatsApp|Line\/|Snapchat|; wv\)/i.test(navigator.userAgent || "")) {
            finish(false, "webview|Google doesn't allow sign-in inside this app's browser. Open the link in Chrome or Safari to sign in, or play as a guest.");
            return;
          }
          // The sheet can't show over Unity's fullscreen mode, so leave it first.
          if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
          loadGis().then(function () {
            if (gisClient !== clientId) {
              google.accounts.id.initialize({
                client_id: clientId,
                callback: function (resp) {
                  if (resp && resp.credential) finish(true, resp.credential + "\n" + nameFrom(resp.credential));
                  else finish(false, "failed|no token from Google");
                },
                auto_select: false,
                cancel_on_tap_outside: false
              });
              gisClient = clientId;
            }
            var box = document.getElementById("tt-gbtn");
            box.innerHTML = "";
            google.accounts.id.renderButton(box, { theme: "outline", size: "large", shape: "pill", text: "continue_with", width: 280 });
            document.getElementById("tt-gsheet").style.display = "flex";
          }, function () {
            finish(false, "failed|couldn't reach Google. check your internet and try again.");
          });
        };
        document.getElementById("tt-gcancel").onclick = function () { finish(false, "cancelled|"); };
      })();

      // ---------- Unity's standard loader (unchanged) ----------
      var canvas = document.querySelector("#unity-canvas");
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      };
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }
      document.querySelector("#unity-loading-bar").style.display = "block";
      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading-bar").style.display = "none";
          document.querySelector("#unity-fullscreen-button").onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
