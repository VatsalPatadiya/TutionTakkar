<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join my room · Tuition Takkar</title>
<meta name="description" content="You're invited to a pen fight on Tuition Takkar. Tap to join the room.">
<meta property="og:title" content="You're invited to a pen fight! ✏️">
<meta property="og:description" content="Tap to join my Tuition Takkar room.">
<meta name="theme-color" content="#2F4A3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root { --desk:#E8E0CB; --board:#2F4A3E; --wood:#6B4A2B; --chalk:#F4F1E8; --yellow:#FFE45C; --ink:#1F2A44; --red:#E8563A; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--desk); color:var(--ink); font-family:"Patrick Hand", system-ui, sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:420px; text-align:center; }
  .board { background:var(--board); border:12px solid var(--wood); border-radius:8px; padding:28px 18px 24px; color:var(--chalk); position:relative; }
  .board::after { content:""; position:absolute; left:-12px; right:-12px; bottom:-26px; height:14px; background:#8A6440; }
  h1 { font-family:"Lilita One", sans-serif; font-weight:400; margin:0; font-size:44px; line-height:1; letter-spacing:1px; }
  h1 span { color:var(--yellow); display:block; }
  .who { font-size:22px; margin:14px 0 4px; }
  .code { font-family:"Lilita One", sans-serif; font-size:52px; letter-spacing:10px; color:var(--yellow); margin:4px 0 0; }
  .btn { display:block; width:100%; margin-top:40px; padding:18px; border:0; border-radius:16px; background:var(--red);
         border-bottom:5px solid #B23A22; color:#fff; font:400 24px "Lilita One", sans-serif; text-decoration:none; letter-spacing:1px; }
  .ghost { display:inline-block; margin-top:14px; background:none; border:2px solid var(--ink); border-radius:12px; padding:10px 18px;
           font:inherit; font-size:18px; color:var(--ink); cursor:pointer; }
  .help { font-size:18px; margin-top:18px; line-height:1.35; }
  .help a { color:var(--ink); }
</style>
</head>
<body>
<main class="card">
  <div class="board">
    <h1>TUITION<span>TAKKAR</span></h1>
    <p class="who" id="who">a classmate saved you a seat</p>
    <p class="code" id="code">······</p>
  </div>
  <a class="btn" id="open" href="#">OPEN THE GAME</a>
  <button class="ghost" id="copy" type="button">Copy code</button>
  <p class="help" id="help">No game yet? Get it, then tap this link again, or open Play Online → Join with code.</p>
</main>
<script>
(function () {
  var PKG = "com.unitygame.tuitiontakkar";
  var m = location.pathname.match(/join\/([A-Za-z0-9]{6})/);
  var code = m ? m[1].toUpperCase() : "";
  var from = (new URLSearchParams(location.search).get("from") || "").slice(0, 14);
  document.getElementById("code").textContent = code || "??????";
  if (from) document.getElementById("who").textContent = from + " saved you a seat";

  var q = "join/" + code + (from ? "?from=" + encodeURIComponent(from) : "");
  var ua = navigator.userAgent || "";
  var android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  var store = "https://play.google.com/store/apps/details?id=" + PKG;
  var link = android
    ? "intent://" + q + "#Intent;scheme=tuitiontakkar;package=" + PKG + ";S.browser_fallback_url=" + encodeURIComponent(store) + ";end"
    : "tuitiontakkar://" + q;
  var open = document.getElementById("open");
  open.href = link;
  if (!android && !ios) open.style.display = "none";
  if (android) document.getElementById("help").innerHTML =
    'No game yet? <a href="' + store + '">Get it on Google Play</a>, then tap the invite link again.';

  // Try to jump straight into the game (some in-app browsers need the button tap instead).
  if (code && (android || ios)) setTimeout(function () { location.href = link; }, 300);

  document.getElementById("copy").addEventListener("click", function () {
    var b = this;
    function done() { b.textContent = "Copied!"; }
    if (navigator.clipboard) navigator.clipboard.writeText(code).then(done, done); else done();
  });
})();
</script>
</body>
</html>
