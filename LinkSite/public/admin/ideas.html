<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Player Ideas · Tuition Takkar</title>
<meta name="theme-color" content="#1C2C33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Kalam:wght@400;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --sage:#CBDDD0; --night:#1C2C33; --board:#2F4A3A; --wood:#7A5534; --yellow:#FFE45C; --yellow-dark:#C7A928;
          --ink:#1F2A44; --soft:#4A5568; --paper:#FFFDF4; --sticky:#FFE680; --pink:#F8C8D4; --blue:#BFE3F0; --red:#B23A22; --mint:#8FE0B5; }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { min-height:100vh; color:var(--ink); font-family:"Nunito", system-ui, sans-serif; background-color:var(--sage);
         background-image:repeating-linear-gradient(135deg, rgba(255,255,255,.18) 0 3px, transparent 3px 14px); }
  header { background:var(--night); border-radius:0 0 22px 22px; }
  .bar { margin:0 auto; padding:14px clamp(16px, 3vw, 40px); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .logo { background:var(--yellow); font-family:"Lilita One", sans-serif; font-size:22px; padding:6px 14px; transform:rotate(-2deg);
          box-shadow:0 3px 0 var(--yellow-dark); color:var(--ink); text-decoration:none; }
  .who { color:#CFE3D6; font-weight:800; font-size:14px; display:flex; gap:10px; align-items:center; }
  .who button { background:transparent; color:#fff; border:2px solid #4E6670; border-radius:10px; padding:6px 12px; font:800 13px "Nunito"; cursor:pointer; }
  main { margin:0 auto; padding:24px clamp(16px, 3vw, 40px) 48px; }
  h1 { font:400 clamp(30px, 6vw, 42px) "Lilita One", sans-serif; margin:0; }
  .hand { font-family:"Kalam", cursive; font-size:19px; color:var(--soft); margin:2px 0 0; }

  .login { max-width:420px; margin:40px auto; background:var(--paper); padding:24px; transform:rotate(-.6deg);
           box-shadow:0 5px 0 rgba(31,42,68,.14); background-image:linear-gradient(#E3EDF5 1px, transparent 1px), linear-gradient(90deg, #E3EDF5 1px, transparent 1px);
           background-size:22px 22px; }
  label { display:block; font-weight:900; font-size:13px; color:#33424F; margin:16px 0 6px; }
  input[type=password], input[type=search], select { width:100%; min-width:0; height:52px; border:3px solid var(--ink); border-radius:12px; padding:0 14px;
           font:800 18px "Nunito"; color:var(--ink); background:#fff; }
  .go { margin-top:14px; width:100%; min-height:56px; border:0; border-radius:14px; background:var(--yellow); color:var(--ink);
        font:400 26px "Lilita One"; box-shadow:0 5px 0 var(--yellow-dark); cursor:pointer; }
  .go:disabled { opacity:.6; cursor:wait; }
  .err { color:var(--red); font-weight:900; font-size:14px; min-height:20px; margin:10px 0 0; }

  .tools { display:grid; grid-template-columns:minmax(0, 1fr) minmax(220px, max-content) auto; gap:10px; margin-top:18px; align-items:end; }
  .tools label { margin-top:0; }
  .refresh { height:52px; border:3px solid var(--ink); background:#fff; border-radius:12px; padding:0 16px; font:900 15px "Nunito"; cursor:pointer; color:var(--ink); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .chip { border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:20px; padding:8px 14px; font:900 14px "Nunito"; cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .chip b { font-weight:900; opacity:.7; margin-left:4px; }

  .list { display:grid; gap:14px; margin-top:18px; }
  .card { background:var(--paper); border-radius:6px; padding:16px 18px; box-shadow:0 4px 0 rgba(31,42,68,.12); border-left:8px solid var(--blue);
          display:flex; flex-direction:column; }
  .card.bug { border-left-color:var(--pink); }
  .card.pen { border-left-color:var(--sticky); }
  .top { display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap; }
  .tag { font:900 12px "Nunito"; letter-spacing:.08em; padding:4px 10px; border-radius:10px; background:var(--blue); }
  .bug .tag { background:var(--pink); }
  .pen .tag { background:var(--sticky); }
  .when { font-weight:800; font-size:13px; color:var(--soft); }
  .text { font-size:18px; font-weight:800; line-height:1.45; margin:10px 0 8px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .meta { margin-top:auto; padding-top:10px; border-top:1px dashed #D5DDE4; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .player { display:flex; align-items:center; gap:8px; background:none; border:0; padding:0; cursor:pointer; font:900 15px "Nunito"; color:#1F5FBF; text-align:left; }
  .player:hover span { text-decoration:underline; }
  .player canvas, .player .ini { width:30px; height:30px; border-radius:50%; flex-shrink:0; border:2px solid var(--ink); }
  .ini { display:inline-flex; align-items:center; justify-content:center; background:var(--blue); color:var(--ink); font:400 15px "Lilita One"; }
  .device { font-size:13px; font-weight:800; color:var(--soft); }
  .onlyme { border-color:#1F5FBF; color:#1F5FBF; }

  .modal { position:fixed; inset:0; background:rgba(16,26,30,.6); display:flex; align-items:center; justify-content:center; padding:16px; z-index:10; }
  .pcard { background:var(--paper); width:min(460px, 100%); max-height:calc(100vh - 32px); overflow:auto; border-radius:18px; padding:22px; position:relative;
           box-shadow:0 8px 0 rgba(0,0,0,.18); }
  .pclose { position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:12px; border:2px solid var(--ink); background:#fff; font:900 18px "Nunito"; cursor:pointer; color:var(--ink); }
  .phead { display:flex; gap:16px; align-items:center; }
  .phead canvas, .phead .ini { width:96px; height:96px; border-radius:50%; border:4px solid var(--ink); flex-shrink:0; font-size:40px; }
  .pname { font:400 28px/1.1 "Lilita One"; margin:0; overflow-wrap:anywhere; }
  .ptitle { font-weight:900; color:#8A6410; font-size:14px; margin-top:4px; }
  .pcode { display:inline-block; margin-top:8px; background:#F3E7C2; border-radius:10px; padding:4px 10px; font:900 13px "Nunito"; letter-spacing:.08em; }
  .pgrid { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px; margin-top:18px; }
  .pstat { background:#EEF2F6; border-radius:12px; padding:12px 8px; text-align:center; }
  .pstat b { display:block; font:400 26px "Lilita One"; }
  .pstat small { font-weight:900; font-size:11px; letter-spacing:.06em; color:var(--soft); }
  .pfoot { margin-top:16px; font-weight:800; font-size:14px; color:var(--soft); }
  .pbtn { margin-top:14px; width:100%; min-height:48px; border:0; border-radius:12px; background:var(--ink); color:#fff; font:900 15px "Nunito"; cursor:pointer; }
  .reply { margin:2px 0 10px; background:#E9F6EE; border-left:4px solid #3E8E5E; border-radius:8px; padding:10px 12px; }
  .reply b { display:block; font:900 12px "Nunito"; letter-spacing:.06em; color:#2E6B47; margin-bottom:4px; }
  .reply p { margin:0; font-size:16px; font-weight:800; line-height:1.4; white-space:pre-wrap; overflow-wrap:anywhere; }
  .rbtn { border:2px solid var(--ink); background:#fff; color:var(--ink); border-radius:10px; padding:7px 14px; font:900 14px "Nunito"; cursor:pointer; }
  .rbtn.done { border-color:#3E8E5E; color:#2E6B47; }
  .rquote { background:#EEF2F6; border-radius:10px; padding:10px 12px; font-weight:800; font-size:15px; line-height:1.4; margin:12px 0 0; white-space:pre-wrap; overflow-wrap:anywhere; }
  textarea { width:100%; min-height:130px; border:3px solid var(--ink); border-radius:12px; padding:12px 14px; font:800 17px/1.4 "Nunito"; color:var(--ink); resize:vertical; }
  .rcount { text-align:right; font-weight:800; font-size:12px; color:var(--soft); margin-top:4px; }
  .rnote { font-weight:800; font-size:14px; margin:10px 0 0; min-height:20px; }
  .rnote.ok { color:#2E6B47; } .rnote.bad { color:var(--red); }
  .empty { text-align:center; padding:40px 16px; font-family:"Kalam", cursive; font-size:22px; color:var(--soft); }
  select { padding-right:36px; }
  .list { grid-template-columns:repeat(auto-fill, minmax(420px, 1fr)); }
  @media (max-width:900px) { .list { grid-template-columns:1fr; } }
  [hidden] { display:none !important; }
  @media (max-width:640px) { .tools { grid-template-columns:1fr 1fr; } .tools .search { grid-column:1 / -1; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="logo" href="/">TUITION TAKKAR</a>
    <div class="who" id="who" hidden><span>owner view</span><button type="button" id="lock">Lock</button></div>
  </div>
</header>

<main>
  <h1>PLAYER IDEAS</h1>
  <p class="hand">ideas, bugs and pen ideas sent from the game</p>

  <form class="login" id="loginForm" novalidate>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="go" id="goBtn" type="submit">OPEN</button>
    <p class="err" id="err" role="alert"></p>
  </form>

  <section id="board" hidden>
    <div class="tools">
      <div class="search"><label for="q">Search</label><input id="q" type="search" placeholder="words, player name, version…"></div>
      <div><label for="month">Month</label><select id="month"></select></div>
      <button class="refresh" id="refresh" type="button">Refresh</button>
    </div>
    <div class="chips" id="chips"></div>
    <p class="err" id="err2" role="alert"></p>
    <div class="list" id="list"></div>
  </section>
  <div class="modal" id="modal" hidden><div class="pcard" id="pcard" role="dialog" aria-modal="true"></div></div>
</main>

<script>
(function () {
  var PROJECT = "b3d37f39-33a9-4065-b2f8-a60042f4ef7c", ENV = "production";
  var AUTH = "https://player-auth.services.api.unity.com/v1/authentication/";
  var CODE = "https://cloud-code.services.api.unity.com/v1/projects/" + PROJECT + "/scripts/list_suggestions";
  var KINDS = { idea: "IDEA", bug: "BUG", pen: "PEN IDEA" };

  var password = "", token = "", items = [], filter = "all", onlyPlayer = null;

  // ---------- faces: the same layered art and colours as the game (Faces.cs / AvatarParts.cs) ----------
  var ORDER = ["bg","hairback","top","face","cheeks","eyes","brows","nose","mouth","beard","glasses","earrings","hair","hat"];
  var PAL = {
    skin: ["#FBE3D0","#F2C9A5","#E0A97E","#C68863","#9C6644","#6B4430"],
    hairc: ["#1B1B1B","#4A2F23","#8A5A3B","#D9A441","#B5482F","#8E8E8E","#3D7BD9","#D94F9C","#3FAF6C"],
    cloth: ["#3D7BD9","#E5483A","#3FAF6C","#F2C14E","#D94F9C","#5B5BD6","#F28C28","#8E8E8E","#1B1B1B","#FFFFFF"],
    iris: ["#6B4430","#2E1E14","#B07D2B","#3D7BD9","#3FAF6C","#8E8E8E"],
    bgc: ["#3D7BD9","#E5483A","#3FAF6C","#F2C14E","#D94F9C","#5B5BD6","#F28C28","#2F4A3A","#F2ECE2"]
  };
  var faceIndex = null, faceImgs = {}, faceCache = {};
  function loadIndex() {
    if (faceIndex) return Promise.resolve(faceIndex);
    return fetch("/admin/face/index.json").then(function (r) { return r.json(); }).then(function (j) {
      faceIndex = {}; (j.parts || []).forEach(function (p) { faceIndex[p.id] = p; }); return faceIndex;
    });
  }
  function img(f) {
    if (!faceImgs[f]) faceImgs[f] = new Promise(function (ok) {
      var i = new Image(); i.onload = function () { ok(i); }; i.onerror = function () { ok(null); }; i.src = "/admin/face/" + f + ".png";
    });
    return faceImgs[f];
  }
  function shade(hex, k) {
    var n = parseInt(hex.slice(1), 16), r = Math.floor((n >> 16 & 255) * k), g = Math.floor((n >> 8 & 255) * k), b = Math.floor((n & 255) * k);
    return "rgb(" + r + "," + g + "," + b + ")";
  }
  function parseFace(code) {
    if (!code || !faceIndex) return null;
    var f = { parts: {}, colors: {} };
    code.split(";").forEach(function (pair) {
      var i = pair.indexOf("="); if (i <= 0) return;
      var k = pair.slice(0, i), v = pair.slice(i + 1);
      if (PAL[k]) { var c = parseInt(v, 10); if (!isNaN(c)) f.colors[k] = Math.max(0, Math.min(PAL[k].length - 1, c)); }
      else if (ORDER.indexOf(k) >= 0 && (v === "" || faceIndex[k + "_" + v])) f.parts[k] = v;
    });
    return f.parts.face ? f : null;
  }
  /** Draws a face code onto a canvas (a promise of the canvas), or null if there's no face. */
  function drawFace(code) {
    if (faceCache[code]) return faceCache[code];
    faceCache[code] = loadIndex().then(function () {
      var f = parseFace(code); if (!f) return null;
      var col = function (k) { return f.colors[k] || 0; };
      var skin = PAL.skin[col("skin")], hair = PAL.hairc[col("hairc")], cloth = PAL.cloth[col("cloth")], iris = PAL.iris[col("iris")], back = PAL.bgc[col("bgc")];
      var hairShade = col("hairc") === 0 ? "#3A3A3A" : shade(hair, 0.70);
      var hat = f.parts.hat ? faceIndex["hat_" + f.parts.hat] : null, hideHair = hat && hat.hidesHair;
      var jobs = [];
      ORDER.forEach(function (layer) {
        var id = layer === "hairback" ? (f.parts.hair ? "hairback_" + f.parts.hair : null) : (f.parts[layer] ? layer + "_" + f.parts[layer] : null);
        var part = id && faceIndex[id]; if (!part) return;
        if (hideHair && (layer === "hair" || layer === "hairback")) return;
        var bg = layer === "bg";
        part.layers.forEach(function (lf) {
          var tint = null;
          switch (lf.t) {
            case "SKIN": tint = skin; break; case "SKIN_SHADE": tint = shade(skin, 0.84); break;
            case "HAIR": tint = hair; break; case "HAIR_SHADE": tint = hairShade; break;
            case "CLOTH": tint = bg ? back : cloth; break; case "CLOTH_SHADE": tint = shade(bg ? back : cloth, 0.80); break;
            case "IRIS": tint = iris; break; case "FIX": tint = null; break; default: tint = "#FFFFFF";
          }
          jobs.push(img(lf.f).then(function (im) { return { im: im, tint: tint }; }));
        });
      });
      return Promise.all(jobs).then(function (layers) {
        var c = document.createElement("canvas"); c.width = c.height = 256;
        var g = c.getContext("2d"), tmp = document.createElement("canvas"); tmp.width = tmp.height = 256;
        var tg = tmp.getContext("2d");
        layers.forEach(function (L) {
          if (!L.im) return;
          if (!L.tint) { g.drawImage(L.im, 0, 0, 256, 256); return; }
          tg.globalCompositeOperation = "source-over"; tg.clearRect(0, 0, 256, 256);
          tg.fillStyle = L.tint; tg.fillRect(0, 0, 256, 256);
          tg.globalCompositeOperation = "destination-in"; tg.drawImage(L.im, 0, 0, 256, 256);
          g.drawImage(tmp, 0, 0);
        });
        return c;
      });
    });
    return faceCache[code];
  }
  /** An avatar element: a copy of the drawn face, or the player's first letter while it loads / if none. */
  function avatar(code, name) {
    var ini = document.createElement("span"); ini.className = "ini";
    ini.textContent = (name || "?").charAt(0).toUpperCase();
    if (code) drawFace(code).then(function (src) {
      if (!src || !ini.parentNode) return;
      var c = document.createElement("canvas"); c.width = c.height = 256; c.getContext("2d").drawImage(src, 0, 0);
      ini.parentNode.replaceChild(c, ini);
    }).catch(function () {});
    return ini;
  }
  var profiles = {};
  function profileOf(pid) {
    if (!pid) return Promise.resolve(null);
    if (!profiles[pid]) profiles[pid] = call({ action: "profile", playerId: pid }).then(function (o) { return o && o.ok ? o.profile : null; })
      .catch(function (e) { delete profiles[pid]; throw e; });
    return profiles[pid];
  }
  var $ = function (id) { return document.getElementById(id); };

  function store(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  // A Unity sign-in for this browser tab (anonymous; it has no rights by itself, the password decides).
  function signIn() {
    var saved = read("tt_admin_session");
    var url = AUTH + (saved ? "session-token" : "anonymous");
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", "ProjectId": PROJECT, "UnityEnvironment": ENV },
      body: JSON.stringify(saved ? { sessionToken: saved } : {})
    }).then(function (r) {
      if (!r.ok) { if (saved) { store("tt_admin_session", null); return signIn(); } throw new Error("couldn't reach Unity (" + r.status + ")"); }
      return r.json();
    }).then(function (j) {
      if (!j || !j.idToken) return j;
      token = j.idToken;
      if (j.sessionToken) store("tt_admin_session", j.sessionToken);
      return j;
    });
  }

  function load(month) { return call({ month: month || "" }); }

  function call(extra) {
    var params = { password: password };
    for (var k in extra) params[k] = extra[k];
    var call = function () {
      return fetch(CODE, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
        body: JSON.stringify({ params: params })
      });
    };
    return (token ? Promise.resolve() : signIn()).then(call).then(function (r) {
      if (r.status === 401) { token = ""; return signIn().then(call); }
      return r;
    }).then(function (r) {
      return r.json().then(function (j) {
        if (!r.ok) throw new Error((j && (j.detail || j.title)) || ("error " + r.status));
        return j.output || j;
      });
    });
  }

  function months() {
    var sel = $("month"), d = new Date();
    sel.innerHTML = "";
    for (var i = 0; i < 12; i++) {
      var y = d.getUTCFullYear(), m = d.getUTCMonth() - i;
      while (m < 0) { m += 12; y--; }
      var o = document.createElement("option");
      o.value = y + "_" + String(m + 1).padStart(2, "0");
      o.textContent = new Date(Date.UTC(y, m, 1)).toLocaleString(undefined, { month: "long", year: "numeric", timeZone: "UTC" });
      sel.appendChild(o);
    }
  }

  function chips() {
    var box = $("chips"), counts = { all: items.length, idea: 0, bug: 0, pen: 0 };
    items.forEach(function (it) { if (counts[it.kind] != null) counts[it.kind]++; });
    box.innerHTML = "";
    [["all", "All"], ["idea", "Ideas"], ["bug", "Bugs"], ["pen", "Pen ideas"]].forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.setAttribute("aria-pressed", filter === c[0] ? "true" : "false");
      b.textContent = c[1];
      var n = document.createElement("b"); n.textContent = counts[c[0]]; b.appendChild(n);
      b.addEventListener("click", function () { filter = c[0]; chips(); render(); });
      box.appendChild(b);
    });
    if (onlyPlayer) {
      var o = document.createElement("button"); o.type = "button"; o.className = "chip onlyme"; o.setAttribute("aria-pressed", "false");
      o.textContent = "Only " + onlyPlayer.name + "  ✕";
      o.addEventListener("click", function () { onlyPlayer = null; chips(); render(); });
      box.appendChild(o);
    }
  }

  function render() {
    var list = $("list"), q = $("q").value.trim().toLowerCase();
    list.innerHTML = "";
    var shown = items.filter(function (it) {
      if (filter !== "all" && it.kind !== filter) return false;
      if (onlyPlayer && it.playerId !== onlyPlayer.id) return false;
      if (!q) return true;
      return [it.text, it.name, it.version, it.platform, it.playerId].join(" ").toLowerCase().indexOf(q) >= 0;
    });
    if (!shown.length) {
      var e = document.createElement("div"); e.className = "empty";
      e.textContent = items.length ? "nothing matches that." : "no ideas this month yet.";
      list.appendChild(e); return;
    }
    shown.forEach(function (it) {
      var kind = KINDS[it.kind] ? it.kind : "idea";
      var card = document.createElement("article"); card.className = "card " + kind;
      var top = document.createElement("div"); top.className = "top";
      var tag = document.createElement("span"); tag.className = "tag"; tag.textContent = KINDS[kind];
      var when = document.createElement("span"); when.className = "when";
      when.textContent = it.at ? new Date(it.at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "";
      top.appendChild(tag); top.appendChild(when);
      var text = document.createElement("p"); text.className = "text"; text.textContent = it.text || "";
      // Bottom row: the player (tap for their profile) and their device.
      var meta = document.createElement("div"); meta.className = "meta";
      var who = document.createElement("button"); who.type = "button"; who.className = "player";
      who.title = "see " + (it.name || "this player") + "'s profile";
      who.appendChild(avatar(null, it.name));
      var nm = document.createElement("span"); nm.textContent = it.name || "player"; who.appendChild(nm);
      if (it.playerId) {
        profileOf(it.playerId).then(function (p) {
          if (p && p.face) { var a = avatar(p.face, it.name); who.replaceChild(a, who.firstChild); }
        }).catch(function () {});
        who.addEventListener("click", function () { openProfile(it); });
      } else who.disabled = true;
      var dev = document.createElement("span"); dev.className = "device";
      dev.textContent = [it.platform, it.version ? "v" + it.version : ""].filter(Boolean).join(" · ");
      meta.appendChild(who); meta.appendChild(dev);
      card.appendChild(top); card.appendChild(text);
      if (it.reply && it.reply.text) {
        var rp = document.createElement("div"); rp.className = "reply";
        var rb = document.createElement("b");
        rb.textContent = "YOUR REPLY" + (it.reply.at ? " · " + new Date(it.reply.at).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }) : "");
        var rt = document.createElement("p"); rt.textContent = it.reply.text;
        rp.appendChild(rb); rp.appendChild(rt); card.appendChild(rp);
      }
      var rbtn = document.createElement("button"); rbtn.type = "button";
      rbtn.className = "rbtn" + (it.reply ? " done" : "");
      rbtn.textContent = it.reply ? "Replied ✓ · edit" : "Reply";
      rbtn.addEventListener("click", function () { openReply(it); });
      meta.appendChild(rbtn);
      card.appendChild(meta);
      list.appendChild(card);
    });
  }

  var TIERS = ["CLASSIC", "SILVER", "GOLD", "PLATINUM", "DIAMOND"];
  function openProfile(it) {
    var m = $("modal"), c = $("pcard");
    c.innerHTML = "";
    var x = document.createElement("button"); x.className = "pclose"; x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Close");
    x.addEventListener("click", closeProfile); c.appendChild(x);
    var loading = document.createElement("p"); loading.className = "hand"; loading.textContent = "loading " + (it.name || "player") + "…";
    c.appendChild(loading);
    m.hidden = false;
    profileOf(it.playerId).then(function (p) {
      c.removeChild(loading);
      var head = document.createElement("div"); head.className = "phead";
      head.appendChild(avatar(p && p.face, (p && p.name) || it.name));
      var hc = document.createElement("div");
      var nm = document.createElement("p"); nm.className = "pname"; nm.textContent = (p && p.name) || it.name || "player"; hc.appendChild(nm);
      if (p && p.title) { var t = document.createElement("div"); t.className = "ptitle"; t.textContent = p.title; hc.appendChild(t); }
      if (p && p.friendId) { var fc = document.createElement("span"); fc.className = "pcode"; fc.textContent = p.friendId; hc.appendChild(fc); }
      head.appendChild(hc); c.appendChild(head);
      if (!p) {
        var none = document.createElement("p"); none.className = "pfoot";
        none.textContent = "no online profile yet (this player hasn't opened the latest app since signing in).";
        c.appendChild(none);
      } else {
        var played = p.played || 0, won = p.won || 0;
        var stats = [["LEVEL", p.level || 1], ["MATCHES", played], ["WINS", won],
                     ["WIN RATE", played ? Math.round(100 * won / played) + "%" : "-"], ["BEST STREAK", p.bestStreak || 0], ["KNOCK-OFFS", p.knockOffs || 0],
                     ["FLAWLESS", p.flawless || 0], ["TOP DESK", p.highestTier >= 0 ? TIERS[p.highestTier] || "-" : "-"], ["BADGES", (p.badgeIds || []).length]];
        var grid = document.createElement("div"); grid.className = "pgrid";
        stats.forEach(function (s) {
          var d = document.createElement("div"); d.className = "pstat";
          var b = document.createElement("b"); b.textContent = s[1]; var sm = document.createElement("small"); sm.textContent = s[0];
          d.appendChild(b); d.appendChild(sm); grid.appendChild(d);
        });
        c.appendChild(grid);
      }
      var mine = items.filter(function (i) { return i.playerId === it.playerId; });
      var foot = document.createElement("p"); foot.className = "pfoot";
      foot.textContent = mine.length + (mine.length === 1 ? " message" : " messages") + " this month · " + [it.platform, it.version ? "v" + it.version : ""].filter(Boolean).join(" · ");
      c.appendChild(foot);
      var only = document.createElement("button"); only.type = "button"; only.className = "pbtn";
      only.textContent = "Show only " + ((p && p.name) || it.name || "this player") + "'s messages";
      only.addEventListener("click", function () { onlyPlayer = { id: it.playerId, name: (p && p.name) || it.name || "player" }; closeProfile(); chips(); render(); });
      c.appendChild(only);
    }).catch(function (e) { loading.textContent = "couldn't load the profile: " + e.message; });
  }
  function closeProfile() { $("modal").hidden = true; }

  // ---------- reply: saved on the idea + a phone notification to the player ----------
  function openReply(it) {
    var m = $("modal"), c = $("pcard");
    c.innerHTML = "";
    var x = document.createElement("button"); x.className = "pclose"; x.type = "button"; x.textContent = "✕"; x.setAttribute("aria-label", "Close");
    x.addEventListener("click", closeProfile); c.appendChild(x);
    var h = document.createElement("p"); h.className = "pname"; h.textContent = "REPLY TO " + String(it.name || "PLAYER").toUpperCase(); c.appendChild(h);
    var q = document.createElement("p"); q.className = "rquote"; q.textContent = it.text || ""; c.appendChild(q);
    var lab = document.createElement("label"); lab.textContent = "Your reply"; lab.setAttribute("for", "rtext"); c.appendChild(lab);
    var ta = document.createElement("textarea"); ta.id = "rtext"; ta.maxLength = 300;
    ta.placeholder = "thanks for the idea! …"; ta.value = it.reply ? it.reply.text : ""; c.appendChild(ta);
    var cnt = document.createElement("div"); cnt.className = "rcount"; c.appendChild(cnt);
    var hint = document.createElement("p"); hint.className = "pfoot";
    hint.textContent = "they get a phone notification: \"Techiebutler replied to your " + (it.kind === "bug" ? "bug report" : it.kind === "pen" ? "pen idea" : "idea") + " 💡\" with your first line.";
    c.appendChild(hint);
    var send = document.createElement("button"); send.type = "button"; send.className = "pbtn"; send.textContent = it.reply ? "SEND UPDATED REPLY" : "SEND REPLY";
    c.appendChild(send);
    var note = document.createElement("p"); note.className = "rnote"; note.setAttribute("role", "status"); c.appendChild(note);
    var paint = function () { cnt.textContent = ta.value.length + " / 300"; send.disabled = ta.value.trim().length < 2; };
    ta.addEventListener("input", paint); paint();
    send.addEventListener("click", function () {
      var txt = ta.value.trim(); if (txt.length < 2) return;
      send.disabled = true; send.textContent = "SENDING…"; note.className = "rnote"; note.textContent = "";
      call({ action: "reply", month: $("month").value, key: it.key, text: txt }).then(function (o) {
        if (!o || !o.ok) throw new Error((o && o.error) || "something went wrong");
        it.reply = o.reply; render();
        note.className = "rnote " + (o.notified ? "ok" : "bad");
        note.textContent = o.notified ? "sent ✓ they got a notification." : "reply saved ✓ but no notification: " + (o.notifyError || "unknown reason");
        send.textContent = "SENT"; ta.disabled = true;
      }).catch(function (e) {
        note.className = "rnote bad"; note.textContent = "couldn't send: " + e.message;
        send.disabled = false; send.textContent = "TRY AGAIN";
      });
    });
    m.hidden = false;
    setTimeout(function () { ta.focus(); }, 50);
  }
  $("modal").addEventListener("click", function (e) { if (e.target === $("modal")) closeProfile(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeProfile(); });

  function show(month, errBox) {
    errBox.textContent = "";
    return load(month).then(function (out) {
      if (!out || !out.ok) throw new Error((out && out.error) || "something went wrong");
      items = out.items || [];
      $("loginForm").hidden = true; $("board").hidden = false; $("who").hidden = false;
      chips(); render();
    });
  }

  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    password = $("pw").value;
    if (!password) { $("err").textContent = "type the password"; return; }
    var btn = $("goBtn"); btn.disabled = true; btn.textContent = "OPENING…";
    show($("month").value, $("err")).catch(function (x) {
      password = ""; $("err").textContent = x.message;
    }).then(function () { btn.disabled = false; btn.textContent = "OPEN"; });
  });

  function reload() {
    var b = $("refresh"); b.disabled = true; b.textContent = "Loading…";
    show($("month").value, $("err2")).catch(function (x) { $("err2").textContent = x.message; })
      .then(function () { b.disabled = false; b.textContent = "Refresh"; });
  }
  $("refresh").addEventListener("click", reload);
  $("month").addEventListener("change", reload);
  $("q").addEventListener("input", render);
  $("lock").addEventListener("click", function () {
    password = ""; items = []; onlyPlayer = null; profiles = {}; closeProfile(); $("pw").value = ""; $("list").innerHTML = "";
    $("board").hidden = true; $("who").hidden = true; $("loginForm").hidden = false;
  });

  months();
})();
</script>
</body>
</html>
